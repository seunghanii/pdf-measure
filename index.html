<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>JCP 도면 관리</title>
    <meta name="description" content="JCP(Jafurah Cogen Project) 도면 관리: PDF 도면 측정, 마크업, 메모, 계기 카드" />
    <meta name="application-name" content="JCP 도면 관리" />
    <meta name="apple-mobile-web-app-title" content="JCP 도면" />
    <script>
      // 화면 모드를 그리기 전에 먼저 적용 (src/lib/theme.js 와 같은 키)
      try {
        var t = localStorage.getItem('pdf-measure:theme')
        if (t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#191c24')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
